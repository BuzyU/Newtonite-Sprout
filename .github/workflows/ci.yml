name: Sprout CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  audit-and-test:
    name: Compliance, Contrast, Weight & a11y Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Regulatory Copy & Compliance Linter
        run: npm run check:copy

      - name: Run Color Token Contrast Audit
        run: npm run check:contrast

      - name: Run Performance & Asset Weight Budgeting
        run: npm run check:weight

      - name: Run Semantic HTML Validation
        run: npm run check:html

      - name: Run Axe-Core Accessibility Evaluation
        run: npm run check:a11y

      - name: Run Subpath Routing & Network Isolation Verification
        run: npm run check:subpath

      - name: Run Markdown Link & Image Target Integrity
        run: npm run check:links

      - name: Run Multi-Viewport Compliance & Ergonomics Matrix
        run: npm run check:matrix
