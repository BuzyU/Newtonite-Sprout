<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80" fill="none" class="ankur-mascot ankur-waving" role="img" aria-label="Ankur the Sprout mascot waving hello">
  <g id="ankur-root">
    <!-- Base seed -->
    <path id="seed-base" d="M26 62C26 55.3726 31.3726 50 38 50H42C48.6274 50 54 55.3726 54 62C54 64.2091 52.2091 66 50 66H30C27.7909 66 26 64.2091 26 62Z" fill="#11382B"/>
    
    <!-- Short Stem -->
    <path id="stem" d="M38 50V36C38 34.8954 38.8954 34 40 34C41.1046 34 42 34.8954 42 36V50H38Z" fill="#11382B"/>
    
    <!-- Left Leaf (resting) -->
    <g id="leaf-left" class="ankur-part-leaf-left">
      <path d="M40 36C27 35 18 24 22 14C30 12 38 24 40 36Z" fill="#2E7D32"/>
      <path d="M37 34C29 27 24 19 25 16" stroke="#A3D9A5" stroke-width="1.5" stroke-linecap="round"/>
    </g>
    
    <!-- Right Leaf (waving upward) -->
    <g id="leaf-right" class="ankur-part-leaf-wave">
      <path d="M40 36C46 30 64 22 66 10C56 6 44 20 40 36Z" fill="#4CAF50"/>
      <path d="M43 33C49 24 59 14 62 11" stroke="#C8E6C9" stroke-width="1.5" stroke-linecap="round"/>
    </g>

    <!-- Face -->
    <g id="face">
      <!-- Eyes looking welcomingly -->
      <circle id="eye-left" cx="35" cy="57" r="2.2" fill="#FDFBF7"/>
      <circle id="eye-right" cx="45" cy="57" r="2.2" fill="#FDFBF7"/>
      <!-- Cheeks -->
      <circle id="cheek-left" cx="31" cy="60" r="1.5" fill="#D97706" opacity="0.7"/>
      <circle id="cheek-right" cx="49" cy="60" r="1.5" fill="#D97706" opacity="0.7"/>
      <!-- Happy open curve -->
      <path id="mouth" d="M37 61C38.5 63 41.5 63 43 61" stroke="#FDFBF7" stroke-width="1.4" stroke-linecap="round"/>
    </g>
  </g>
</svg>
