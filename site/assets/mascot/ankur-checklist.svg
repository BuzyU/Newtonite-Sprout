<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80" fill="none" class="ankur-mascot ankur-checklist" role="img" aria-label="Ankur the Sprout mascot holding a document checklist">
  <g id="ankur-root">
    <!-- Base seed -->
    <path id="seed-base" d="M26 62C26 55.3726 31.3726 50 38 50H42C48.6274 50 54 55.3726 54 62C54 64.2091 52.2091 66 50 66H30C27.7909 66 26 64.2091 26 62Z" fill="#11382B"/>
    
    <!-- Short Stem -->
    <path id="stem" d="M38 50V36C38 34.8954 38.8954 34 40 34C41.1046 34 42 34.8954 42 36V50H38Z" fill="#11382B"/>
    
    <!-- Left Leaf -->
    <g id="leaf-left" class="ankur-part-leaf-left">
      <path d="M40 36C28 34 20 22 24 12C32 10 40 24 40 36Z" fill="#2E7D32"/>
      <path d="M38 34C30 26 26 18 27 15" stroke="#A3D9A5" stroke-width="1.5" stroke-linecap="round"/>
    </g>
    
    <!-- Right Leaf -->
    <g id="leaf-right" class="ankur-part-leaf-right">
      <path d="M40 36C52 34 60 22 56 12C48 10 40 24 40 36Z" fill="#4CAF50"/>
      <path d="M42 34C50 26 54 18 53 15" stroke="#C8E6C9" stroke-width="1.5" stroke-linecap="round"/>
    </g>

    <!-- Checklist Clipboard held in front -->
    <g id="checklist-board">
      <!-- Board backing -->
      <rect x="42" y="46" width="18" height="24" rx="3" fill="#D97706"/>
      <!-- Paper sheet -->
      <rect x="44" y="49" width="14" height="19" rx="1.5" fill="#FFFFFF"/>
      <!-- Clip at top -->
      <rect x="48" y="45" width="6" height="3" rx="1" fill="#11382B"/>
      <!-- Checklist items -->
      <path d="M46 54L48 56L51 52" stroke="#166534" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="53" y1="54" x2="56" y2="54" stroke="#8B9890" stroke-width="1.2" stroke-linecap="round"/>
      <path d="M46 59L48 61L51 57" stroke="#166534" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="53" y1="59" x2="56" y2="59" stroke="#8B9890" stroke-width="1.2" stroke-linecap="round"/>
      <path d="M46 64L48 66L51 62" stroke="#166534" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="53" y1="64" x2="56" y2="64" stroke="#8B9890" stroke-width="1.2" stroke-linecap="round"/>
    </g>

    <!-- Face shifted slightly left to accommodate board -->
    <g id="face">
      <circle id="eye-left" cx="33" cy="57" r="2" fill="#FDFBF7"/>
      <circle id="eye-right" cx="40" cy="57" r="2" fill="#FDFBF7"/>
      <circle id="cheek-left" cx="30" cy="60" r="1.5" fill="#D97706" opacity="0.6"/>
      <path id="mouth" d="M34 61C35.5 62.5 38 62.5 39 61" stroke="#FDFBF7" stroke-width="1.2" stroke-linecap="round"/>
    </g>
  </g>
</svg>
